name: Regenerate REP icons
on:
  workflow_dispatch:
  push:
    branches: [feature/rep-blue-plate-pulse-icon]
    paths:
      - public/plate-pulse.svg
      - scripts/generate-icons.py
      - .github/workflows/update-pwa-icons.yml
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'CairoSVG==2.7.1'
      - run: python scripts/generate-icons.py
      - name: Commit generated icons
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/icon-180.png public/icon-192.png public/icon-512.png
          git diff --cached --quiet || (git commit -m 'Generate blue Plate Pulse PWA icons' && git push)
